[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftsense-fm"
version = "0.1.0"
description = "Deterministic fixed-scale microscopy localization baseline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
]

[tool.unittest]
test-command = "python -m unittest discover -s tests -v"
